<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<script src="https://cdn.jsdelivr.net/gh/kitao/pyxel/wasm/pyxel.js"></script>

<script>
function showEndingMovie(filename){

    let video = document.getElementById("endingVideo");

    video.src = filename + ".mp4";

    video.style.display = "block";

    video.play();

    video.onended = function(){

        video.style.display = "none";

        if(window.pyxel_app){
            window.pyxel_app.movie_finished();
        }
    };
}
</script>

</head>

<body>

<video
    id="endingVideo"
    style="
        display:none;
        position:fixed;
        left:0;
        top:0;
        width:100%;
        height:100%;
        z-index:9999;
        background:black;
    "
></video>

<pyxel-run
    name="DODTAROTTO.py"
    gamepad="enabled">
</pyxel-run>

</body>
</html>
